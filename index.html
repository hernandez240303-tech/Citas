<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Studio | Agenda Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff8fa3">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</head>
<body>

<div class="app-container">
    <header class="main-header">
        <div class="logo">
            <i class="fas fa-crown"></i>
            <h1>Glow<span>Studio</span></h1>
        </div>
        <button id="toggleDark" class="btn-theme">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <main class="content-wrapper">
        <!-- PANEL IZQUIERDO -->
        <aside class="side-panel">
            <div class="welcome-card">
                <h2>Beauty Dashboard</h2>
                <p>Tu espacio personal de belleza</p>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <i class="fas fa-calendar-check"></i>
                    <span id="countCitas">0</span>
                    <label>Hoy</label>
                </div>
                <div class="stat-box">
                    <i class="fas fa-hand-holding-dollar"></i>
                    <span id="totalAnticipos">$0</span>
                    <label>Caja</label>
                </div>
            </div>

            <div class="card form-card">
                <h3 id="formTitle">Nueva Cita</h3>
                <form id="formCita">
                    <input type="hidden" id="editId">
                    
                    <div class="field">
                        <label>Nombre de la clienta</label>
                        <input type="text" id="nombre" placeholder="Nombre completo" required>
                    </div>
                    <div class="field">
                        <label>Servicio</label>
                        <input type="text" id="servicio" placeholder="Ej. Balayage, Uñas, etc." required>
                    </div>
                    <div class="field-row">
                        <div class="field">
                            <label>Fecha</label>
                            <input type="date" id="fecha" required>
                        </div>
                        <div class="field">
                            <label>Hora</label>
                            <input type="time" id="hora" required>
                        </div>
                    </div>
                    <div class="field">
                        <label>Anticipo ($)</label>
                        <input type="number" id="anticipo" placeholder="0.00" step="0.01">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="btnSubmit" class="btn-submit">Confirmar Cita</button>
                        <button type="button" id="btnCancelarEdit" class="btn-cancel-edit" style="display: none;">Cancelar Modificación</button>
                    </div>
                </form>
            </div>
        </aside>

        <!-- PANEL DERECHO -->
        <section class="main-panel">
            <div class="filter-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscar" placeholder="Buscar clienta...">
                </div>
                <select id="filtroEstado">
                    <option value="todos">Todas las citas</option>
                    <option value="pendiente">Pendientes</option>
                    <option value="finalizada">Finalizadas</option>
                </select>
            </div>
            
            <ul id="listaCitas" class="citas-container"></ul>
        </section>
    </main>
</div>

<!-- MODAL ELIMINAR -->
<div id="modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
        <div class="modal-icon">
            <i class="fas fa-trash-can"></i>
        </div>
        <h3>¿Eliminar registro?</h3>
        <p>Esta acción quitará a la clienta de la lista permanentemente.</p>
        <div class="modal-actions">
            <button id="confirmarEliminar" class="btn-danger">Eliminar Ahora</button>
            <button id="cancelarEliminar" class="btn-cancel">Mantener Cita</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
